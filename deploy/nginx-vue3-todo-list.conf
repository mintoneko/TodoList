server {
    listen 80;
    listen [::]:80;
    server_name todo.loliowo.com;

    root /var/www/vue3-todo-list;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name todo.loliowo.com;

    root /var/www/vue3-todo-list;
    index index.html;

    ssl_certificate /etc/nginx/ssl/todo.loliowo.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/todo.loliowo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
